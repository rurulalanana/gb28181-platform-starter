<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    favicon 必须显式声明。
    不声明时浏览器会去请求 /favicon.ico，而项目里没有这个文件，
    每次打开/刷新页面后端都会打一条 NoResourceFoundException 的 ERROR 日志。
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!--
    LivePlayer 的基础库（video.js 9 + flvjs + Hls/Webrtc tech）。
    必须同步加载且**不能用 type="module"**：它以 UMD 形式挂 window.videojs，
    而 `@liveqing/liveplayer-v3` 组件内部直接引用该全局。
    组件本体（liveplayer-component.min.js）由 src/player/LivePlayerEngine.js
    在首次使用时动态注入（它要求先有 window.Vue）。
  -->
  <script src="/js/liveplayer-lib.min.js"></script>
  <title>GB28181 视频监控平台</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
