# nginx 录像直读配置
#
# 用途：让 nginx 接管公网入口（48088），录像文件用 sendfile 直读，
#       其余请求（前端页面 / API）反代回 Java（内部端口）。
#
# ## 为什么要这么绕
#
# Spring Boot 的静态资源处理器处理 Range 请求非常慢 —— 实测同一个 18MB 录像：
#
#   | 方式                        | 单段 2MB 耗时 | 吞吐      |
#   |-----------------------------|---------------|-----------|
#   | Spring Boot 静态映射         | 16~20 秒      | 110KB/s   |
#   | nginx (sendfile + keep-alive)| 0.06~0.15 秒  | 24MB/s    |
#
# 差 200 倍。录像回放要按 GOP 分段下载很多次 Range，这个差距直接决定
# 「起播 15 秒还是 2 秒」。
#
# 注意：Spring Boot 的**整文件**下载其实有 1.9MB/s，只有 **Range** 请求慢。
#
# ## 和 Java 侧的关系
#
# Java 的 `SpaWebConfiguration` 里原本也注册了 `/record/**` 静态映射，
# 现在 `gb28181.record-static-enabled` **默认为 false**，即不再由 Java 提供
# 录像文件 —— 请求到 48088 就被 nginx 拦下直读磁盘，根本到不了 Java。
# 只有没有 nginx 的单机/内网部署才需要把它打开回退。
#
# ## 为什么不能让 nginx 单独开一个端口
#
# 云主机的公网端口是白名单放通的，实测只有 48081 / 48088 / 48089 可达。
# nginx 新开的端口（试过 48090/48091）公网访问不通。
# 所以只能让 nginx 接管已经在白名单里的 48088，Java 退到内网端口。
#
# ## 安装步骤
#
# 1. nginx 主配置加两个 map（$cors_origin / $connection_upgrade）：
#
#    ```nginx
#    http {
#        map $http_origin $cors_origin {
#            default $http_origin;
#            ""      "*";
#        }
#        map $http_upgrade $connection_upgrade {
#            default upgrade;
#            ""      close;
#        }
#    }
#    ```
#
#    > $http_origin 兜底成 * 的原因：某些请求（如跨域 HEAD）不带 Origin 头，
#    > 此时 $http_origin 为空 → nginx 会把整个 Access-Control-Allow-Origin
#    > 头丢掉 → 浏览器报「没有该头」。
#
# 2. 放本文件到 /etc/nginx/conf.d/gb28181-record.conf
#
# 3. Java 改到内部端口（改 /opt/gb28181/gb.sh 的启动参数）：
#
#    ```
#    --server.port="${GB_APP_PORT:-48088}"
#    ```
#
#    .env 里配 `GB_APP_PORT=48092`。
#
# 4. 重启：
#
#    ```bash
#    cd /opt/gb28181
#    ./gb.sh stop
#    nginx -s reload          # nginx 接管 48088
#    ./gb.sh start            # Java 起在 48092
#    ```
#
# ## 注意
#
# - 录像目录由 nginx 直接读，**不经过 Java**，所以 Java 挂了录像照样能播
#   （前端页面会挂，但已在播的录像不受影响）。
#   代价是 nginx 自己无法判断“该不该给他看”，因此必须靠 auth_request
#   子请求去问 Java —— 这也是唯一一个“Java 挂了录像会 403”的例外。
# - `root` 要指向 `/opt/gb28181`（不是 `/opt/gb28181/record`）——
#   URL 里已经带了 `/record/` 前缀。
# - 录像在录制中时文件会增长，这里用 `no-cache` 保证读到最新内容。
#
# ## 升级顺序（很重要）
#
# 先部署新 jar、再改 nginx：
#
# 1. 部署新 jar（此版本起接口回填的 playUrl/downloadUrl 自带 ?e=&t=）
# 2. 验证播放正常（此时 nginx 还不校验，带参数的地址照常工作）
# 3. 才把本文件的 auth_request 生效并 nginx -s reload
# 4. 验证：不带签名的地址 403，带签名的正常播放
#
# 反过来（先改 nginx）会让**所有录像**在升级窗口内 403，
# 因为老版本根本没有 /api/v1/record/auth 这个端点。

server {
    # 公网入口（原来由 Spring Boot 直接监听 48088）
    listen      48088;
    server_name _;

    # 录像根目录的**父目录**：URL 里的 /record/ 前缀正好对上
    root /opt/gb28181;

    # ---- 传输性能（录像直读的关键）----
    # sendfile：零拷贝，直接从文件读，不进用户态缓冲区
    sendfile    on;
    # 输出缓冲区：录像是大文件，缓冲区太小会频繁写 socket
    output_buffers 4 256k;
    # 允许一个连接上多个 Range（分段下载用）
    max_ranges   16;

    # ---- 连接复用 ----
    # 录像要下很多段 Range，每段都是独立请求。
    # keep-alive 能复用 TCP 连接（高延迟链路上重建连接代价很大）。
    keepalive_timeout  300s;
    keepalive_requests 1000;

    # ---- 跨域 ----
    # 前端页面与文件同源（都在 48088），这里主要是兜底。
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type, Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    add_header Vary "Origin" always;

    # CORS 预检
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---- 录像文件：nginx 直接 sendfile，不经 Java ----
    location /record/ {
        # 地址签名鉴权。
        #
        # 录像请求根本不经过 Spring，Sa-Token 拦不到它，所以“知道路径就能下载”。
        # 这里把每个请求（含每次 Range 续传）转给 Java 校验地址里的
        # ?e=<过期秒>&t=<签名>，2xx 放行 / 403 拒绝。
        #
        # 开关在 Java 侧（record.url-sign-enabled）：关闭时鉴权端点一律返回 204，
        # 所以这里**不需要**跟着改配置，也不会出现「两边配置不一致导致全部录像打不开」。
        auth_request /_record_auth;

        add_header Accept-Ranges "bytes" always;
        # 录像在录制中时文件会增长，禁缓存保证读到最新内容
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Vary "Origin" always;
        try_files $uri =404;
    }

    # 录像鉴权子请求（内部）：只有 nginx 能访问，外部直接请求会 404。
    #
    # 必须把原始 URI 用 X-Original-URI 转过去：子请求自身的 URI
    # 恒为 /_record_auth，不带待校验的录像路径与签名。
    location = /_record_auth {
        internal;
        proxy_pass http://127.0.0.1:48092/api/v1/record/auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---- 其余请求（前端页面 / API）反代回 Java（内部 48092）----
    location / {
        proxy_pass http://127.0.0.1:48092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 大文件下载不要被缓冲截断
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
