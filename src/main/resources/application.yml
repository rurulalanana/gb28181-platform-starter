server:
  port: 8080
  shutdown: graceful
  compression:
    # 开启 gzip：jessibuca 的 decoder.wasm 有 1MB，
    # 公网链路上未压缩传输实测会被中间网关掐断
    # （ERR_CONTENT_LENGTH_MISMATCH + 502），压缩后约 350KB 就稳了。
    # 顺带把前端 JS/CSS 也压了，首屏更快。
    enabled: true
    mime-types: application/wasm,application/javascript,text/javascript,text/css,text/html,application/json,application/xml,image/svg+xml
    min-response-size: 2048

spring:
  application:
    name: gb28181-platform-starter
  # ==================== 定时任务线程池 ====================
  # 【必须配置】Spring Boot 默认 pool.size=1，所有 @Scheduled 共用一个线程。
  # 本平台有 8 个定时任务（心跳巡检、录像对账、录像保活、空闲流回收、
  # 孤儿流认领、磁盘清理、操作日志清理、状态日志清理），一旦某个慢下来
  # （录像对账要递归遍历整个录像目录、磁盘清理要删大量文件），
  # 其它任务全被推迟 —— 表现为「设备掉线了但界面迟迟不更新」。
  #
  # 取 4：足够让耗时的清理类任务与秒级的巡检类任务互不阻塞，
  # 又不至于让并发事务数过多。
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: gb-sched-
  jackson:
    default-property-inclusion: non_null
  datasource:
    # 【不要把密码写在这里】
    # 本文件会被打进 jar 并提交到 Git 仓库，写死等于公开凭据。
    # 密码一律通过环境变量注入；下方默认值只留给本地开发。
    url: ${GB_DB_URL:jdbc:postgresql://160.202.254.65:25432/gb28181}
    username: ${GB_DB_USERNAME:postgres}
    password: ${GB_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

# ==================== MyBatis-Plus ====================
mybatis-plus:
  # 实体类所在包（配合 @MapperScan 在 MybatisPlusConfiguration 中声明）
  type-aliases-package: io.github.rurulalanana.starter.entity
  configuration:
    # 下划线列名 -> 驼峰属性名（如 device_id -> deviceId）
    map-underscore-to-camel-case: true
    # 允许把 null 字段也写入 SQL（配合实体上的 @TableField 策略使用）
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      # 主键自增（对应建表脚本的 BIGSERIAL）
      id-type: auto
      # 逻辑删除字段（实体未使用，保留默认约定）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    io.github.rurulalanana: INFO
    gov.nist.javax.sip: INFO
    # SIP 协议栈逐包日志（每次 MESSAGE/INVITE/事务都打）量极大，
    # 排障时临时改 DEBUG 即可；常开会让日志卷到百 MB 级并拖慢 IO。
    io.github.rurulalanana.gb28181.sip: INFO
    # 需要看 SQL 时打开下面这行
    # io.github.rurulalanana.starter.mapper: DEBUG


# ==================== Sa-Token ====================
# 会话已持久化到 PostgreSQL（sa_token_store 表，见 SaTokenJdbcDao）：
# 服务重启后已签发的 token 依然有效，用户无需重新登录。
sa-token:
  token-name: Authorization
  # 有效期 7 天（秒）；active-timeout=-1 表示只要在有效期内就不因闲置被踢
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  # 从「请求参数」里读 token。
  # <video src="..."> 这类请求带不了自定义头，只能把 token 拼在 URL 上，
  # 录像文件播放（/cloudrecord/file/{id}）就靠这个通过鉴权。
  is-read-body: true

gb28181:
  # 平台 20 位编码
  platform-id: "34020000002000000001"
  # SIP 信令监听
  sip-host: "0.0.0.0"
  sip-port: 5060
  # SIP 对外通告地址（写入 INVITE 的 From / Contact）。留空自动推断本机非回环 IPv4。
  # 接真实设备时若平台有多个网卡或经过 NAT，务必改成设备可达的本机 IP，
  # 否则设备无法回包，表现为「点播无响应」。
  sip-advertised-ip: "123.57.109.223"

  # ==================== SIP 注册鉴权（平台密码） ====================
  # 系统级统一密码：设置后设备 REGISTER 需通过 Digest 鉴权，密码错误返回 401。
  # 留空 = 不鉴权（内网联调方便，公网部署务必设置）。
  # 注意：鉴权只校验密码，不校验用户名（各厂商 username 填法不一，强制校验会误拦设备）。
  sip-password: ""

  # 媒体 IP：SDP c= 行与播放地址主机，必须是设备可达地址；留空自动探测本机 IP
  media-ip: "123.57.109.223"
  # 媒体服务端口（注意：Spring Boot 自己占用 8080，媒体 HTTP 改用 8081）
  http-port: 8081
  rtmp-port: 11935
  rtsp-port: 18554
  rtc-port: 18000
  app: rtp
  # RTP 收流模式
  # false（默认）= 每通道独占一个端口（ZLM 自动分配，受内置端口池 [30000,35000] 限制）
  # true          = 单端口收流：所有设备推到同一端口，ZLM 按 RTP 的 SSRC 分流
  #                 优点：端口数不受限、防火墙只需放行一个端口
  #                 代价：RTCP 失效（无丢包率）、RTP 超时不再触发 detach 回调、不能做 SSRC 过滤
  rtp-single-port: true
  # 单端口模式下的收流端口（UDP 与 TCP 被动共用）
  rtp-single-port-number: 24560
  # 「无人观看」自动关流延迟（毫秒）。点播后若一直没有播放器拉流，
  # ZLM 到点就关流并向设备发 BYE。默认 45 秒：给前端留足首次加载播放器
  # SDK（jessibuca.js + decoder.wasm 约 1.3MB）与 WASM 编译的时间
  # （公网慢时 20 秒内可能还没建立拉流连接，流会被提前关掉→“点播很慢”）。
  stream-none-reader-delay-ms: 45000
  # 随流上下线自动录像
  auto-record: false
  record-root: ""

  # 云端录像单文件最长时长（秒），到点由 ZLM 自动切分片。
  #
  # 这是「崩溃损失上限」，不是磁盘优化参数。ZLM 原生库存在未捕获的 C++ 异常
  # （实测 RtmpMediaSourceMuxer::getOwnerPoller not implemented → terminate()
  # → SIGABRT），整个进程会崩掉，正在写的分片来不及写 moov，留下大小正常但
  # 无法播放的孤儿文件（moov atom not found，无法修复）。
  #
  # 因此这个值 = 一次崩溃最多丢多久录像：
  #   3600（1 小时，ZLM 默认）→ 实测崩一次丢 55 分钟 / 319 MB
  #   1800（30 分钟，当前值） → 最多丢 30 分钟，一天 24 个文件
  #   300 （5 分钟）          → 最多丢 5 分钟，但一天 288 个文件（太碎）
  #
  # 取 1800：崩溃损失与文件数量折中。磁盘占用不变，列表按段展示。
  # 原生库崩溃若被上游修复，可调回 3600 减少文件数。
  record-max-second: 1800

  # 是否由本进程提供 /record/** 录像文件。
  # 默认 false，交给 nginx 的 location /record/（sendfile 直读）——
  # Spring Boot 静态映射的 Range 请求只有 110KB/s，nginx 有 24MB/s，差 200 倍，
  # 直接决定录像起播是「15 秒」还是「2 秒」。配置见 deploy/nginx-record.conf。
  # 没有 nginx 的单机/内网部署可改为 true 回退到本进程提供（大文件拖动会变慢）。
  record-static-enabled: false

  # 平台运行时行为
  starter:
    # 启动时执行 db/schema.sql 建表（幂等：全部 CREATE TABLE IF NOT EXISTS）
    init-schema: true
    # 启动后自动点播第一台在线设备，便于快速验证「注册→INVITE→收流」
    self-check: false
    # 设备离线判定阈值（秒）：超过该时长未收到心跳即标记离线，应大于心跳周期 2~3 倍
    device-offline-seconds: 180
    # 离线巡检间隔（毫秒）
    offline-scan-interval-ms: 60000
    # 设备注册后自动下发查询采集数据（目录/信息/状态），落库到 gb_channel / gb_device
    auto-collect: true
    # 同一设备两次自动采集的最小间隔（秒），防止设备频繁重启把设备打爆
    collect-interval-seconds: 300
    # 是否采集设备信息（厂商/型号/固件）
    collect-device-info: true
    # 是否采集设备状态
    collect-device-status: true
    # 自动录像对账间隔（毫秒）：补归档丢失下线事件的录像（见 RecordService#reconcileAutoRecordings）
    record-reconcile-interval-ms: 60000
    # 对账首跑延迟（毫秒）：给启动过程中的流上下线事件留出到达时间
    record-reconcile-initial-delay-ms: 30000

    # ==================== 录像磁盘清理（必须配，否则磁盘会被写满） ====================
    # 云端录像 24 小时不停写，单通道约 350MB/小时 ≈ 8GB/天。
    # 没有清理时实测 30G 的盘只够 3 天，写满后 ZLM 分片写失败、
    # PostgreSQL（同盘）也可能写失败，整个平台瘫痪。
    #
    # 两级策略：
    #   1) 按天：删掉超过 record-retain-days 的非重要录像
    #   2) 按水位：若仍超过 record-disk-max-used-percent，继续删最老的
    #      （永远跳过 important=true 与最近 record-keep-min-days 天）
    # 清理间隔（毫秒）
    record-purge-interval-ms: 600000
    # 首跑延迟（毫秒）：启动后先让对账/保活跑稳，再动删文件
    record-purge-initial-delay-ms: 120000
    # 录像保留天数；<=0 表示不按天删，只受磁盘水位约束
    record-retain-days: 7
    # 磁盘使用率上限（%）：超过就删最老的录像。不要设到 95，
    # 必须给数据库/日志/转码临时文件留余量
    record-disk-max-used-percent: 85
    # 磁盘告急时也必须保留最近几天（防止配置失误把录像清空）
    record-keep-min-days: 1

    # 状态变更日志保留天数（gb_status_log）；<=0 表示不清理。
    # 比操作日志（7 天）长：它是排查「某天设备为什么掉线」的关键证据。
    status-log-retain-days: 30

  # 对象存储（云端录像归档）。采用 S3 兼容协议，一套配置覆盖主流对象存储：
  #   阿里云 OSS：endpoint=https://oss-cn-hangzhou.aliyuncs.com  region=cn-hangzhou  path-style=false
  #   腾讯云 COS：endpoint=https://cos.ap-guangzhou.myqcloud.com  region=ap-guangzhou
  #   MinIO：     endpoint=http://192.168.1.10:9000              path-style=true（必须）
  #   七牛云 Kodo：endpoint=https://s3-cn-east-1.qiniucs.com      region=cn-east-1
  #   AWS S3：    endpoint 留空自动推导                            region=us-east-1
  # 不配置（enabled=false 或密钥为空）时，录像保存在本地磁盘 gb28181.record-root
  oss:
    enabled: false
    endpoint: ""
    region: "us-east-1"
    access-key: ""
    secret-key: ""
    bucket: ""
    # 对象键前缀（目录）：<prefix>/<通道编码>/<文件名>
    prefix: "record"
    # MinIO / Ceph 等自建存储必须设为 true
    path-style: false
    # 桶开启公共读时设为 true（直接拼永久外链）；否则生成签名 URL
    public-read: false
    # 签名 URL 有效期（秒）
    sign-expire-seconds: 3600
    # 上传成功后是否删除本地文件（false 保留本地副本便于回放兜底）
    delete-local-after-upload: false
    connect-timeout-ms: 10000
    # 录像文件可能很大，读超时默认 5 分钟
    read-timeout-ms: 300000